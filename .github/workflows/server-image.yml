name: Server image

# Builds the UniDocs server Docker image and pushes it to GitHub Container
# Registry (ghcr.io). Users then run it with:
#
#   docker run -p 8550:8550 -v unidocs-data:/data \
#     -e UNIDOCS_API_TOKEN=... ghcr.io/lukas-dev-de/unidocs-server:latest
#
# Normal use: publish a release (Releases -> "Draft a new release" -> Publish).
# The image is tagged `latest`, `vX.Y.Z` and `X.Y`. A manual run from the
# Actions tab builds `latest` plus a `sha-<commit>` tag.
#
# Heads-up: GitHub only runs `release`-triggered workflows whose file already
# exists on the default branch, so merge this into `main` before the first
# published release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; the repo owner is mixed case.
      - name: Resolve image name
        id: image
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${OWNER}/unidocs-server" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
