[project]
name = "unidocs"
version = "2.4.0" # keep in sync with src/ui/settings_dialog.py and CHANGELOG.md - see tools/check_version.py
description = "Document management and productivity application"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Lukas Buschauer", email = "lukas.buschauer@gmail.com" }
]
# Exact flet pins, no ranges. The bundled Python flet MUST have the same
# version as the client shell, and `flet build` takes the shell from the
# flet-cli version (see FLET_CLI_VERSION in .github/workflows/release-build.yml).
# flet 1.0 changed the socket wire format (4-byte length prefix + type byte
# instead of a raw msgpack stream), so a mismatched pair talks past each other
# and the app window stays blank. Bump all four pins together with the
# workflow env values, never just one.
dependencies = [
    "flet==0.84.0",
    "watchdog>=6.0.0",
    "platformdirs>=4.9.6",
]

[dependency-groups]
dev = [
    "flet-cli==0.84.0",
    "flet-desktop==0.84.0",
    "flet-web==0.84.0",
]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "de.buschauermedia"
product = "unidocs"
company = "Buschauer Media"
copyright = "Copyright (C) 2026 Buschauer Media"

[tool.flet.app]
path = "src"
