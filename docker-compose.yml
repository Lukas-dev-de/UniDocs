services:
  unidocs:
    build: .
    ports:
      - "8550:8550"
    environment:
      # Pin the API token so it survives restarts and is easy to find.
      # Generate one with: python -c "import secrets; print(secrets.token_urlsafe(32))"
      # Leave empty to let the server generate + print one on first start.
      UNIDOCS_API_TOKEN: ${UNIDOCS_API_TOKEN:-}
    volumes:
      - unidocs-data:/data
      - unidocs-config:/root/.config/UniDocs
    restart: unless-stopped

volumes:
  unidocs-data:
  unidocs-config:
